name: Feature request
description: Propose a bounded capability or validation improvement.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete limitation or user need without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed bounded capability
      description: State the observable outcome and explicit non-goals.
    validations:
      required: true
  - type: checkboxes
    id: expansion
    attributes:
      label: Scope expansion
      description: Select every architectural boundary this proposal may affect.
      options:
        - label: Persistent state, service, queue, or scheduler
        - label: External runtime or global installation
        - label: Third-party dependency
        - label: Network or cross-machine execution
        - label: Public interface or evidence-schema compatibility
        - label: Permission or external-action boundary
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and fixture proposal
      description: Explain how the result could be tested and independently reviewed.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and documentation impact
      description: Identify affected Skill references, ADRs, specs, evidence packages, and bilingual documentation.
    validations:
      required: true
